[package]
name = "direct_rfq_arb"
version = "0.1.0"
description = "Direct on-chain RFQ settlement primitives for flash-loan composition"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "direct_rfq_arb"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"
